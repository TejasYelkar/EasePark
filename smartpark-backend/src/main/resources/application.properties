spring.application.name=smartpark-backend 
server.port=8080

spring.data.mongodb.uri=mongodb://localhost:27017/smartpark
# MongoDB index creation
spring.data.mongodb.auto-index-creation=true 

# SmartPark parking configuration
smartpark.slots.bike-total=24
smartpark.slots.car-total=12

# Configure these environment variables to enable email-based password resets.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
smartpark.mail.from=${MAIL_FROM:}

